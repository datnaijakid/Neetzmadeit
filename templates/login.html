{% extends 'base.html' %} {% block title %}Admin Login - Neetzmadeit{% endblock
%} {% block content %}
<section class="py-4 py-md-5">
  <div class="container px-0 px-sm-3">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <h2 class="text-center mb-4 fw-bold section-heading">Admin Login</h2>

            <form method="POST">
              <div class="mb-3">
                <label for="username" class="form-label fw-bold">Username</label>
                <input
                  type="text"
                  class="form-control rounded-pill px-3 custom-form-input"
                  id="username"
                  name="username"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-bold">Password</label>
                <input
                  type="password"
                  class="form-control rounded-pill px-3 custom-form-input"
                  id="password"
                  name="password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <div class="d-grid">
                <button
                  type="submit"
                  class="btn btn-success btn-lg rounded-pill fw-bold py-3 fs-5"
                >
                  <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
